name: Validate knowledge hub
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - run: uv run python scripts/validate.py
      - run: uv run pytest
      - run: uv run zensical build

  browser:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - run: uv sync --locked --group browser
      - run: uv run --group browser python -m playwright install --with-deps firefox
      - run: uv run zensical build
      - run: uv run --group browser python scripts/check_browser.py
